# ============================================================
# L&D Operations Copilot — Hybrid GitHub Actions Workflow
# ============================================================
# Automatic Dual-Mode Operation:
# 1. CLOUD RUN MODE:
#    If 'CLOUD_RUN_URL' secret is set, it triggers your Cloud Run endpoint.
# 2. DIRECT RUNNER MODE (Zero-Billing Fallback):
#    If 'CLOUD_RUN_URL' is NOT set (e.g. while billing verification is pending),
#    it executes the Python pipeline directly on the GitHub Actions runner.
#
# When your GCP billing verification finishes, simply deploy to Cloud Run
# and set the CLOUD_RUN_URL secret. It switches automatically with zero code changes!
# ============================================================

name: Daily Morning Brief

on:
  # 9:00 AM IST = 3:30 AM UTC
  schedule:
    - cron: '30 3 * * *'

  # Allow manual trigger for testing via GitHub Actions UI
  workflow_dispatch:

jobs:
  generate-brief:
    name: Generate & Send Daily Brief
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # ──────────────────────────────────────────────────────────
      # MODE A: Cloud Run Mode (Active when CLOUD_RUN_URL exists)
      # ──────────────────────────────────────────────────────────
      - name: 🚀 Trigger via Cloud Run
        if: ${{ secrets.CLOUD_RUN_URL != '' }}
        run: |
          echo "🌐 CLOUD_RUN_URL secret detected — invoking Cloud Run service..."
          echo "🕘 Triggering brief at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${{ secrets.CLOUD_RUN_URL }}/generate-brief" \
            -H "Authorization: Bearer ${{ secrets.API_TRIGGER_TOKEN }}" \
            -H "Content-Type: application/json" \
            --max-time 120)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "📊 Response Code: $HTTP_CODE"
          echo "📋 Response Body:"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Cloud Run brief generation failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "✅ Daily brief generated and sent successfully via Cloud Run!"

      # ──────────────────────────────────────────────────────────
      # MODE B: Direct Runner Mode (Active when CLOUD_RUN_URL is empty)
      # ──────────────────────────────────────────────────────────
      - name: 📥 Checkout repository (Direct Runner Mode)
        if: ${{ secrets.CLOUD_RUN_URL == '' }}
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12 (Direct Runner Mode)
        if: ${{ secrets.CLOUD_RUN_URL == '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies (Direct Runner Mode)
        if: ${{ secrets.CLOUD_RUN_URL == '' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌅 Generate and Send Daily Brief (Direct Runner Mode)
        if: ${{ secrets.CLOUD_RUN_URL == '' }}
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
          ACE_SHEET_ID: ${{ secrets.ACE_SHEET_ID }}
          API_TRIGGER_TOKEN: ${{ secrets.API_TRIGGER_TOKEN }}
          USER_EMAIL: ${{ secrets.USER_EMAIL || 'yuvrajtale070@gmail.com' }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'project-e5a2b3a6-f74d-4dfa-bed' }}
        run: |
          echo "💻 No CLOUD_RUN_URL configured — running directly on GitHub Actions runner..."
          echo "🕘 Running Daily Brief at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          python -m src.run_daily
