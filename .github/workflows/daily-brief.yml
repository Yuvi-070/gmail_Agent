# ============================================================
# L&D Operations Copilot — Daily Brief GitHub Actions Workflow
# ============================================================
# Runs directly inside GitHub Actions runner (100% FREE, NO CLOUD RUN REQUIRED)
# Ideal when GCP billing is verification pending.
#
# Triggers every day at 9:00 AM IST (3:30 AM UTC).
# ============================================================

name: Daily Morning Brief

on:
  # 9:00 AM IST = 3:30 AM UTC
  schedule:
    - cron: '30 3 * * *'

  # Allow manual trigger for testing via GitHub Actions UI
  workflow_dispatch:

jobs:
  generate-brief:
    name: Generate & Send Daily Brief
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌅 Generate and Send Daily Brief
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
          ACE_SHEET_ID: ${{ secrets.ACE_SHEET_ID }}
          API_TRIGGER_TOKEN: ${{ secrets.API_TRIGGER_TOKEN }}
          USER_EMAIL: ${{ secrets.USER_EMAIL || 'yuvrajtale070@gmail.com' }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'project-e5a2b3a6-f74d-4dfa-bed' }}
        run: |
          echo "🕘 Running Daily Brief at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          python -m src.run_daily
