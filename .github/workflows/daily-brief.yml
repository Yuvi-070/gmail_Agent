# ============================================================
# L&D Operations Copilot — Daily Brief Workflow
# ============================================================
# Supports BOTH:
#   Option 1: Direct Runner (Runs directly on GitHub Actions runner — No Cloud Run needed)
#   Option 2: Cloud Run (Calls Cloud Run endpoint via HTTPS POST)
#
# Manual Trigger:
#   You can choose the mode explicitly from the GitHub Actions UI!
#
# Daily Cron (9:00 AM IST = 3:30 AM UTC):
#   Runs in 'auto' mode — uses Cloud Run if CLOUD_RUN_URL exists,
#   otherwise automatically uses GitHub Actions Direct Runner.
#   Includes schedule diagnostics + a schedule-only IST guardrail
#   to avoid unintended afternoon sends from heavily delayed runs.
# ============================================================

name: Daily Morning Brief

on:
  schedule:
    # GitHub Actions cron is UTC.
    # 03:30 UTC = 09:00 IST (Asia/Kolkata)
    - cron: '30 3 * * *'

  workflow_dispatch:
    inputs:
      execution_mode:
        description: 'Select execution mode'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'github_actions_direct'
          - 'cloud_run'

jobs:
  generate-brief:
    name: Generate & Send Daily Brief
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌅 Generate and Send Daily Brief
        env:
          CLOUD_RUN_URL: ${{ secrets.CLOUD_RUN_URL }}
          API_TRIGGER_TOKEN: ${{ secrets.API_TRIGGER_TOKEN }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
          ACE_SHEET_ID: ${{ secrets.ACE_SHEET_ID }}
          USER_EMAIL: ${{ secrets.USER_EMAIL || 'yuvrajtale070@gmail.com' }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'project-e5a2b3a6-f74d-4dfa-bed' }}
          EXECUTION_MODE: ${{ inputs.execution_mode || 'auto' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON_EXPR: ${{ github.event.schedule || '' }}
        run: |
          echo "🕘 Execution Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC') ($(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST'))"
          echo "🔔 Trigger: $GITHUB_EVENT_NAME"
          echo "🗓️ Schedule Expression (when scheduled): ${SCHEDULE_CRON_EXPR:-N/A}"
          echo "⚙️ Mode Selected: $EXECUTION_MODE"

          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            if [ "$SCHEDULE_CRON_EXPR" != "30 3 * * *" ]; then
              echo "⚠️ Unexpected schedule expression detected: $SCHEDULE_CRON_EXPR"
            fi

            IST_HOUR=$(TZ='Asia/Kolkata' date '+%H')
            if [ "$IST_HOUR" != "09" ] && [ "$IST_HOUR" != "10" ]; then
              echo "⏭️ Scheduled run is outside 09:00-10:59 IST guardrail; skipping send."
              echo "ℹ️ This prevents unintended afternoon delivery from delayed scheduler runs."
              exit 0
            fi
          fi

          USE_CLOUD_RUN=false
          if [ "$EXECUTION_MODE" = "cloud_run" ]; then
            USE_CLOUD_RUN=true
          elif [ "$EXECUTION_MODE" = "auto" ] && [ -n "$CLOUD_RUN_URL" ]; then
            USE_CLOUD_RUN=true
          fi

          if [ "$USE_CLOUD_RUN" = "true" ]; then
            if [ -z "$CLOUD_RUN_URL" ]; then
              echo "❌ Error: CLOUD_RUN_URL secret is not set!"
              exit 1
            fi
            echo "🌐 Invoking Cloud Run endpoint: $CLOUD_RUN_URL/generate-brief"
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST "$CLOUD_RUN_URL/generate-brief" \
              -H "Authorization: Bearer $API_TRIGGER_TOKEN" \
              -H "Content-Type: application/json" \
              --max-time 120)

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n -1)

            echo "📊 Response Code: $HTTP_CODE"
            echo "📋 Response Body:"
            echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"

            if [ "$HTTP_CODE" -ne 200 ]; then
              echo "❌ Cloud Run execution failed with HTTP $HTTP_CODE"
              exit 1
            fi
            echo "✅ Daily brief delivered successfully via Cloud Run!"
          else
            echo "💻 Running directly on GitHub Actions runner (Direct Runner Mode)..."
            python -m src.run_daily
          fi
